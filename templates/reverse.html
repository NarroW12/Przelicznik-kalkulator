{% extends "base.html" %}
{% block title %}Tryb odwrotny — Przelicznik{% endblock %}

{% block header %}
<header class="page-header">
    <h1>Ile zarobisz w czasie X?</h1>
    <p>Wpisz czas, dowiedz się ile to pieniędzy na rękę</p>
</header>
{% endblock %}

{% block content %}
<section class="card">
    <div class="card-header">
        <h2 class="card-title">⏱️ Czas pracy</h2>
    </div>

    <div class="field-row">
        <div class="field">
            <label for="rev_amount">Ilość</label>
            <input type="number" id="rev_amount" step="0.5" min="0" value="8">
        </div>
        <div class="field grow">
            <label for="rev_unit">Jednostka</label>
            <select id="rev_unit">
                <option value="hours">godzin</option>
                <option value="days" selected>dni roboczych (8 h)</option>
                <option value="weeks">tygodni (40 h)</option>
                <option value="months">miesięcy (168 h)</option>
                <option value="years">lat (2016 h)</option>
            </select>
        </div>
    </div>

    <button id="btn-reverse" class="btn btn-primary btn-lg">Oblicz zarobki</button>

    <div id="reverse-result" class="result hidden">
        <div class="big-result" id="reverse-big-result"></div>
        <div class="meta" id="reverse-meta"></div>
    </div>
</section>
{% endblock %}
