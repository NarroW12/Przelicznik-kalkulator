{% extends "base.html" %}
{% block title %}Cele oszczędnościowe — Przelicznik{% endblock %}

{% block header %}
<header class="page-header">
    <h1>Cele oszczędnościowe</h1>
    <p>Plan dojścia do tego, na czym Ci zależy</p>
</header>
{% endblock %}

{% block content %}
<section class="card">
    <div class="card-header">
        <h2 class="card-title">🎯 Dodaj cel</h2>
    </div>

    <div class="field-row">
        <div class="field grow">
            <label for="goal_name">Nazwa celu</label>
            <input type="text" id="goal_name" placeholder="np. Nowy laptop">
        </div>
        <div class="field">
            <label for="goal_price">Cena (zł)</label>
            <input type="number" id="goal_price" step="0.01" min="0" placeholder="5000">
        </div>
    </div>

    <div class="field-row">
        <div class="field grow">
            <label for="goal_monthly">Odkładam miesięcznie (zł)</label>
            <input type="number" id="goal_monthly" step="0.01" min="0" placeholder="500">
        </div>
        <div class="field">
            <label for="goal_saved">Już mam (zł)</label>
            <input type="number" id="goal_saved" step="0.01" min="0" value="0">
        </div>
    </div>

    <button id="btn-add-goal" class="btn btn-primary">+ Dodaj cel</button>
</section>

<section class="card">
    <div class="card-header">
        <h2 class="card-title">📊 Twoje cele</h2>
        <button id="btn-clear-goals" class="btn btn-danger hidden">Wyczyść wszystkie</button>
    </div>

    <div id="goals-empty" class="empty-state">
        <div class="empty-icon">🎯</div>
        <div>Nie masz jeszcze żadnych celów</div>
    </div>

    <div id="goals-list"></div>
</section>
{% endblock %}
